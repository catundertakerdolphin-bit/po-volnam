<script type="module">
import * as THREE from 'three';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
/* OceanAudio: original local demo, decoded uploads and deterministic audio features.
   Texture: RGBA8 = bass / mid / high / RMS energy; exact width = featureCount.
   Sample i is at i * duration / (featureCount - 1). UV for seconds t is
   (clamp(t / duration, 0, 1) * (featureCount - 1) + 0.5) / featureCount.
   No sound is started until play() is called from a user gesture. */
class OceanAudio {
  constructor() {
    this._context = null;
    this._master = null;
    this._source = null;
    this._buffer = null;
    this._offset = 0;
    this._startedAt = 0;
    this._playing = false;
    this._volume = 0.55;
    this._title = 'Tidal Sketch';
    this._features = new Float32Array(5);
    this._featureCount = 1;
    this._featureStep = 0;
    this._texture = null;
    this._waveform = new Float32Array(512);
    this._loadToken = 0;
    this._playToken = 0;
    this.onended = null;
  }
  get duration() { return this._buffer ? this._buffer.duration : 0; }
  get title() { return this._title; }
  get playing() { return this._playing; }
  get currentTime() {
    if (!this._playing || !this._context) return this._offset;
    return Math.min(this.duration, this._offset + Math.max(0, this._context.currentTime - this._startedAt));
  }
  get waveform() { return this._waveform; }
  get featureCount() { return this._featureCount; }
  get featureStep() { return this._featureStep; }
  get featureTexture() {
    if (!this._texture) {
      const bytes = new Uint8Array(this._featureCount * 4);
      for (let i = 0; i < this._featureCount; i++) {
        for (let c = 0; c < 4; c++) bytes[i * 4 + c] = Math.round(this._features[i * 5 + c] * 255);
      }
      this._texture = new THREE.DataTexture(bytes, this._featureCount, 1, THREE.RGBAFormat, THREE.UnsignedByteType);
      this._texture.minFilter = this._texture.magFilter = THREE.LinearFilter;
      this._texture.wrapS = this._texture.wrapT = THREE.ClampToEdgeWrapping;
      this._texture.generateMipmaps = false;
      this._texture.colorSpace = THREE.NoColorSpace;
      this._texture.needsUpdate = true;
      this._texture.userData = { duration: this.duration, count: this._featureCount, step: this._featureStep };
    }
    return this._texture;
  }
  _ensureContext() {
    if (this._context) return this._context;
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) throw new Error('Этот браузер не поддерживает Web Audio. Попробуйте Safari или Chrome.');
    this._context = new Audio({ latencyHint: 'interactive' });
    this._master = this._context.createGain();
    this._master.gain.value = this._volume;
    this._master.connect(this._context.destination);
    return this._context;
  }
  async initDemo(progress = () => {}) {
    const token = ++this._loadToken;
    this.stop();
    const context = this._ensureContext();
    progress(0.02, 'Сочиняем море…');
    const sampleRate = 32000, duration = 72;
    const buffer = context.createBuffer(2, sampleRate * duration, sampleRate);
    const left = buffer.getChannelData(0), right = buffer.getChannelData(1);
    const tau = Math.PI * 2;
    let noiseState = 0x6ac21d43;
    const noise = () => {
      noiseState ^= noiseState << 13; noiseState ^= noiseState >>> 17; noiseState ^= noiseState << 5;
      return ((noiseState >>> 0) / 4294967296) * 2 - 1;
    };
    const note = midi => 440 * Math.pow(2, (midi - 69) / 12);
    const add = (start, length, sound, gain, pan = 0) => {
      const first = Math.max(0, Math.floor(start * sampleRate));
      const end = Math.min(left.length, Math.floor((start + length) * sampleRate));
      const lp = Math.sqrt((1 - pan) * .5) * gain;
      const rp = Math.sqrt((1 + pan) * .5) * gain;
      for (let i = first; i < end; i++) {
        const value = sound((i - first) / sampleRate);
        left[i] += value * lp; right[i] += value * rp;
      }
    };
    // Dm9 — Bbmaj7 — Fmaj7 — C6. Eight-bar phrases; no borrowed samples.
    const chords = [[50, 57, 60, 64, 69], [46, 53, 57, 60, 65], [41, 53, 57, 60, 64], [48, 55, 57, 64, 67]];
    const beat = .5625, bar = beat * 4, chordLength = bar * 2;
    for (let block = 0; block < 16; block++) {
      if (token !== this._loadToken) return false;
      const start = block * chordLength, chord = chords[block % chords.length];
      const phraseGain = block === 8 || block === 9 ? .76 : 1;
      for (let n = 0; n < chord.length; n++) {
        const frequency = note(chord[n]);
        const pan = (n / (chord.length - 1) - .5) * 1.25;
        add(start, chordLength + .65, t => {
          const attack = Math.min(1, t / .48);
          const release = Math.min(1, Math.max(0, (chordLength + .65 - t) / 1.15));
          const envelope = attack * release;
          return envelope * (Math.sin(tau * frequency * t) * .70 + Math.sin(tau * frequency * 1.0022 * t) * .23 + Math.sin(tau * frequency * 2 * t) * .08);
        }, .058 * phraseGain, pan);
      }
      for (let b = 0; b < 8; b++) {
        const globalBeat = block * 8 + b, t = start + b * beat;
        const breakDown = block === 8 || block === 9;
        const intro = globalBeat < 8;
        const outro = globalBeat >= 120;
        const rhythmGain = breakDown ? .30 : outro ? .68 : 1;
        const root = chord[0] - 12 + (b === 6 ? 12 : 0);
        const bassFrequency = note(root);
        add(t + .008, beat * .89, s => {
          const env = Math.min(1, s / .008) * Math.exp(-s * 5) * Math.min(1, (beat * .89 - s) / .065);
          return env * (Math.sin(tau * bassFrequency * s) + .18 * Math.sin(tau * bassFrequency * 2 * s));
        }, intro ? .105 : .19 * phraseGain);
        if (!intro && (!breakDown || b % 4 === 0)) {
          add(t, .27, s => {
            const phase = tau * (48 * s + (108 / 42) * (1 - Math.exp(-42 * s)));
            return Math.sin(phase) * Math.exp(-s * 17) + noise() * Math.exp(-s * 180) * .11;
          }, .50 * rhythmGain);
        }
        if (!intro && b % 2 === 1 && !breakDown) {
          let priorNoise = 0;
          add(t, .20, s => {
            const raw = noise(), high = raw - priorNoise * .70; priorNoise = raw;
            return high * Math.exp(-s * 26) * .62 + Math.sin(tau * 174 * s) * Math.exp(-s * 31) * .24;
          }, .19 * rhythmGain, .12);
        }
        if (b % 2 === 0 || !breakDown) {
          for (let h = 0; h < 2; h++) {
            let prior = 0;
            add(t + h * beat / 2 + (h ? .012 : 0), .085, s => {
              const raw = noise(), high = raw - prior; prior = raw;
              return high * Math.exp(-s * 73) * Math.min(1, s / .001);
            }, (h ? .045 : .061) * rhythmGain, h ? .38 : -.3);
          }
        }
        const order = [2, 4, 3, 1, 4, 2, 3, 4];
        const frequency = note(chord[order[b]] + 12 + (block % 4 === 3 && b === 7 ? 12 : 0));
        const arpStart = t + .025;
        const bell = s => Math.min(1, s / .004) * Math.exp(-s * 5.5) * (Math.sin(tau * frequency * s) + .17 * Math.sin(tau * frequency * 2 * s) * Math.exp(-s * 7));
        add(arpStart, .85, bell, .073 * phraseGain, Math.sin(globalBeat * 1.37) * .48);
        add(arpStart + beat * .75, .85, bell, .025 * phraseGain, -.52);
        add(arpStart + beat * 1.5, .85, bell, .012 * phraseGain, .52);
      }
      progress(.02 + .24 * (block + 1) / 16, 'Сочиняем море…');
      await new Promise(resolve => setTimeout(resolve, 0));
    }
    // Gentle linked soft compression, stereo cross-delay and click-free edges.
    const delay = Math.round(sampleRate * beat * .75);
    let envelope = 0;
    for (let i = 0; i < left.length; i++) {
      if (i >= delay) {
        const dryL = left[i], dryR = right[i];
        left[i] = dryL + right[i - delay] * .065;
        right[i] = dryR + left[i - delay] * .065;
      }
      const peak = Math.max(Math.abs(left[i]), Math.abs(right[i]));

    // Fan caps, hidden mostly inside the beak and the tail peduncle.
    for (const end of [0, profile.length - 1]) {
      const center = positions.length / 3;
      positions.push(0, profile[end][3], profile[end][0]);
      for (let j = 0; j < segments; j++) {
        const a = end * segments + j, b = end * segments + (j + 1) % segments;
        const start = indices.length;
        indices.push(...(end === 0 ? [center, a, b] : [center, b, a]));
        geometry.addGroup(start, 3, j > 5 && j < 10 ? 2 : 1);
      }
    }
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setIndex(indices);
    batchMaterialGroups(geometry);
    geometry.computeVertexNormals();
    geometry.computeBoundingSphere();
    return geometry;
  }
  mesh(ringBody(rings), materials).name = 'Sculpted body';
  mesh(ringBody([
    [-1.090, 0.019, 0.020, -0.042],
    [-1.045, 0.046, 0.032, -0.044],
    [-0.895, 0.061, 0.042, -0.038],
    [-0.740, 0.074, 0.049, -0.024]
  ], 12), materials).name = 'Long dolphin rostrum';

  // A thin tapered solid with a curved, concave silhouette. The final value
  // of each outline point is its half thickness; fin tips stay delicate.
  function fin(outline, plane, top = 0, bottom = 1, parent = pose) {
    const contour = outline.map(p => new THREE.Vector2(p[0], p[1]));
    const triangles = THREE.ShapeUtils.triangulateShape(contour, []);
    const p = [], index = [], count = outline.length;
    for (const sign of [1, -1]) {
      for (const [u, v, half] of outline) {
        p.push(...(plane === 'yz' ? [sign * half, u, v] : [u, sign * half, v]));
      }
    }
    const g = new THREE.BufferGeometry();
    for (const tri of triangles) {
      const a = tri[0], b = tri[1], c = tri[2];
      const start = index.length;
      index.push(...(plane === 'yz' ? [a, b, c] : [a, c, b]));
      g.addGroup(start, 3, top);
      index.push(...(plane === 'yz' ? [a + count, c + count, b + count] : [a + count, b + count, c + count]));
      g.addGroup(start + 3, 3, bottom);
    }
    for (let i = 0; i < count; i++) {
      const j = (i + 1) % count, start = index.length;
      index.push(i, j, i + count, j, j + count, i + count);
      g.addGroup(start, 6, top);
    }
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    g.setIndex(index);
    batchMaterialGroups(g);
    g.computeVertexNormals();
    g.computeBoundingSphere();
    // Horizontal left and right outlines have opposing winding, so retain
    // the outward faces of both without adding extra triangles.
    const result = mesh(g, materials, parent);
    result.material.forEach(m => { m.side = THREE.DoubleSide; });
    return result;
  }

  fin([
    [0.182, -0.205, 0.038], [0.303, -0.116, 0.026],
    [0.458, 0.094, 0.004], [0.365, 0.082, 0.012],
    [0.265, 0.117, 0.021], [0.174, 0.275, 0.029]
  ], 'yz', 0, 0).name = 'Swept dorsal fin';

  const flippers = [-1, 1].map(side => {
    const pivot = new THREE.Group();
    pivot.position.set(side * 0.172, -0.107, -0.205);
    pose.add(pivot);
    fin([
      [0, -0.047, 0.024], [side * 0.184, 0.006, 0.019],
      [side * 0.408, 0.255, 0.003], [side * 0.224, 0.208, 0.012],
      [0, 0.126, 0.023]
    ], 'xz', 0, 2, pivot).name = side < 0 ? 'Left pectoral fin' : 'Right pectoral fin';
    return pivot;
  });

  const tail = new THREE.Group();
  tail.position.set(0, -0.021, 0.61);
  pose.add(tail);
  mesh(ringBody([
    [0, 0.078, 0.065, 0], [0.17, 0.049, 0.038, 0],
    [0.28, 0.069, 0.027, 0]
  ], 12), materials, tail).name = 'Tail peduncle';
  fin([
    [0, 0.210, 0.031], [-0.184, 0.210, 0.022],
    [-0.479, 0.316, 0.003], [-0.369, 0.373, 0.009],
    [-0.137, 0.360, 0.019], [0, 0.315, 0.015],
    [0.137, 0.360, 0.019], [0.369, 0.373, 0.009],
    [0.479, 0.316, 0.003], [0.184, 0.210, 0.022]
  ], 'xz', 0, 1, tail).name = 'Horizontal crescent flukes';

  const eyeGeometry = new THREE.IcosahedronGeometry(0.025, 1);
  const shineGeometry = new THREE.IcosahedronGeometry(0.007, 0);
  for (const side of [-1, 1]) {
    const eye = mesh(eyeGeometry, dark);
    eye.position.set(side * 0.175, 0.063, -0.578);
    eye.scale.set(0.65, 1, 1.04);
    const shine = mesh(shineGeometry, eyeShine);
    shine.position.set(side * 0.189, 0.070, -0.587);
    // A short fine mouth crease makes the rostrum read as a beak.
    const mouth = new THREE.CatmullRomCurve3([
      new THREE.Vector3(side * 0.025, -0.052, -1.073),
      new THREE.Vector3(side * 0.055, -0.057, -0.930),
      new THREE.Vector3(side * 0.071, -0.050, -0.778),
      new THREE.Vector3(side * 0.124, -0.028, -0.681)
    ]);
    mesh(new THREE.TubeGeometry(mouth, 8, 0.0027, 4, false), dark);
  }
  const blowhole = mesh(new THREE.IcosahedronGeometry(0.018, 0), dark);
  blowhole.position.set(0, 0.239, -0.368);
  blowhole.scale.set(0.8, 0.20, 1.15);

  return {
    group,
    animate(time, speed = 1, turn = 0, jumpProgress = 0) {
      const swimming = Math.max(0, Math.min(12, Math.abs(Number(speed) || 0)));
      const steering = Math.max(-1, Math.min(1, Number(turn) || 0));
      const airborne = Math.max(0, Math.min(1, Number(jumpProgress) || 0));
      const phase = (Number(time) || 0) * (5.5 + swimming * 0.18);
      const stroke = Math.sin(phase);
      tail.rotation.x = stroke * (0.20 - airborne * 0.09);
      pose.rotation.x = Math.sin(phase - 0.6) * 0.021 * (1 - airborne);
      pose.rotation.y = -steering * 0.16;
      pose.rotation.z = -steering * 0.29;
      pose.position.y = Math.sin(phase) * 0.012 * (1 - airborne);
      flippers[0].rotation.z = 0.12 + Math.sin(phase - 0.8) * 0.07 - steering * 0.12;
      flippers[1].rotation.z = -0.12 - Math.sin(phase - 0.8) * 0.07 - steering * 0.12;
      flippers[0].rotation.x = flippers[1].rotation.x = -airborne * 0.18;
    },
    dispose() {
      ownedGeometries.forEach(geometry => geometry.dispose());
      [...materials, dark, eyeShine].forEach(material => material.dispose());
      group.removeFromParent();
    }
  };
}

// Pooled splash particles. Pass the water-surface world position to splash().
// The complete pool uses two instanced draw calls plus up to six thin rings.
function createSplashSystem(scene) {
  const root = new THREE.Group();
  root.name = 'Dolphin splash pool';
  scene.add(root);
  const perKind = 84;
  const geometry = new THREE.IcosahedronGeometry(1, 0);
  const dropletMaterial = new THREE.MeshStandardMaterial({
    color: 0xd5f9f4, roughness: 0.15, metalness: 0.05,
    transparent: true, opacity: 0.78, depthWrite: false
  });
  const foamMaterial = new THREE.MeshBasicMaterial({
    color: 0xf2ffef, transparent: true, opacity: 0.70, depthWrite: false
  });
  const instances = [dropletMaterial, foamMaterial].map((material, kind) => {
    const result = new THREE.InstancedMesh(geometry, material, perKind);
    result.name = kind ? 'Surface foam' : 'Airborne droplets';
    result.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    result.frustumCulled = false;
    root.add(result);
    return result;
  });
  const particles = Array.from({ length: perKind * 2 }, (_, i) => ({
    kind: i < perKind ? 0 : 1, index: i % perKind,
    p: new THREE.Vector3(), v: new THREE.Vector3(),
    age: 9, life: 0, radius: 0, surface: 0, angle: 0
  }));
  const ringGeometry = new THREE.RingGeometry(0.965, 1, 48);
  const rings = Array.from({ length: 6 }, () => {
    const material = new THREE.MeshBasicMaterial({
      color: 0xe6fff9, transparent: true, opacity: 0, depthWrite: false,
      side: THREE.DoubleSide
    });
    const object = new THREE.Mesh(ringGeometry, material);
    object.rotation.x = -Math.PI / 2;
    object.visible = false;
    root.add(object);
    return { object, material, age: 10, life: 0.9, size: 1 };
  });
  let dropCursor = 0, foamCursor = 0, ringCursor = 0;
  const matrixObject = new THREE.Object3D();
  matrixObject.scale.setScalar(0);
  matrixObject.updateMatrix();
  for (const instanced of instances) {
    for (let i = 0; i < perKind; i++) instanced.setMatrixAt(i, matrixObject.matrix);
    instanced.instanceMatrix.needsUpdate = true;
  }

  return {
    splash(position, strength = 1) {
      const power = Math.max(0.2, Math.min(2, Number(strength) || 1));
      const count = Math.floor(25 + power * 14);
      for (let i = 0; i < count; i++) {
        const p = particles[(dropCursor++) % perKind];
        const angle = Math.random() * Math.PI * 2;
        const spread = (0.4 + Math.random() * 1.1) * power;
        p.p.copy(position).add(new THREE.Vector3(Math.cos(angle) * 0.16, 0.03, Math.sin(angle) * 0.16));
        p.v.set(Math.cos(angle) * spread, (1.25 + Math.random() * 1.85) * power, Math.sin(angle) * spread);
        p.age = 0;
        p.life = 0.48 + Math.random() * 0.47;
        p.radius = (0.017 + Math.random() * 0.034) * Math.sqrt(power);
        p.surface = position.y;
        p.angle = angle;
      }
      for (let i = 0; i < 22; i++) {
        const p = particles[perKind + (foamCursor++) % perKind];
        const angle = Math.random() * Math.PI * 2;
        const spread = (0.15 + Math.random() * 0.6) * power;
        p.p.copy(position).add(new THREE.Vector3(Math.cos(angle) * 0.15, 0.016, Math.sin(angle) * 0.15));
        p.v.set(Math.cos(angle) * spread, 0, Math.sin(angle) * spread);
        p.age = 0;
        p.life = 0.55 + Math.random() * 0.65;
        p.radius = 0.035 + Math.random() * 0.07;
        p.surface = position.y;
        p.angle = angle;
      }
      for (let i = 0; i < 2; i++) {
        const ring = rings[(ringCursor++) % rings.length];
        ring.age = -i * 0.12;
        ring.life = 0.85 + i * 0.15;
        ring.size = power * (0.9 + i * 0.2);
        ring.object.position.copy(position);
        ring.object.position.y += 0.012;
        ring.object.visible = false;
      }
    },
    update(dt, time = 0, surfaceHeight = null) {
      const step = Math.max(0, Math.min(0.05, Number(dt) || 0));
      for (const p of particles) {
        p.age += step;
        const remaining = Math.max(0, 1 - p.age / p.life);
        if (remaining > 0) {
          if (p.kind === 0) p.v.y -= 5.8 * step;
          p.p.addScaledVector(p.v, step);
          if(p.kind===1&&surfaceHeight)p.p.y=surfaceHeight(p.p.x,p.p.z,time)+.018;
          if (p.kind === 0 && p.p.y < p.surface) p.age = p.life;
          matrixObject.position.copy(p.p);
          matrixObject.rotation.set(p.kind ? 0 : time * 2.1, p.angle, p.kind ? 0 : time * 1.7);
          const size = p.radius * Math.min(1, remaining * 4);
          matrixObject.scale.set(size, size * (p.kind ? 0.12 : 1.65), size);
        } else matrixObject.scale.setScalar(0);
        matrixObject.updateMatrix();
        instances[p.kind].setMatrixAt(p.index, matrixObject.matrix);
      }
      instances.forEach(instance => { instance.instanceMatrix.needsUpdate = true; });
      for (const ring of rings) {
        ring.age += step;
        const t = ring.age / ring.life;
        ring.object.visible = t >= 0 && t < 1;
        if (ring.object.visible) {
          if(surfaceHeight)ring.object.position.y=surfaceHeight(ring.object.position.x,ring.object.position.z,time)+.018;
          ring.object.scale.setScalar((0.15 + t * 1.2) * ring.size);
          ring.material.opacity = Math.pow(1 - t, 1.5) * 0.16;
        }
      }
    },
    dispose() {
      geometry.dispose();
      ringGeometry.dispose();
      dropletMaterial.dispose();
      foamMaterial.dispose();
      rings.forEach(ring => ring.material.dispose());
      root.removeFromParent();
    }
  };
}

// Sun-ray footprint caustics: Snell refraction through the animated surface,
// first intersection with the scrolling terrain, then irradiance from beam-area compression.
// The wave-equation ripple field contributes to the same surface normal as the swells.
function createGameWater(camera, shared) {
  const mobile=matchMedia('(pointer:coarse)').matches, resolution=mobile?192:256;
  // Long swells are shared verbatim between CPU buoyancy and GPU displacement.
  const swellWaves=[
    {x:.94,z:.342,k:1.15,speed:.95,amplitude:.115,phase:0},
    {x:-.38,z:.925,k:.82,speed:.71,amplitude:.052,phase:1.8},
    {x:.68,z:-.733,k:1.65,speed:1.20,amplitude:.025,phase:-1.2}
  ];
  function surfaceHeight(x=0,z=0,time=shared.time.value){return swellWaves.reduce((h,w)=>h+w.amplitude*Math.sin((x*w.x+z*w.z)*w.k-time*w.speed+w.phase),0);}
  function surfaceVelocity(x=0,z=0,time=shared.time.value){return swellWaves.reduce((h,w)=>h-w.amplitude*w.speed*Math.cos((x*w.x+z*w.z)*w.k-time*w.speed+w.phase),0);}
  const longWaveGLSL=`
    float oceanLongHeight(vec2 p,float t){return ${swellWaves.map(w=>`${w.amplitude.toFixed(5)}*sin(dot(p,vec2(${w.x.toFixed(5)},${w.z.toFixed(5)}))*${w.k.toFixed(5)}-t*${w.speed.toFixed(5)}+${w.phase.toFixed(5)})`).join('+')};}
    vec2 oceanLongSlope(vec2 p,float t){return ${swellWaves.map(w=>`vec2(${w.x.toFixed(5)},${w.z.toFixed(5)})*${(w.amplitude*w.k).toFixed(7)}*cos(dot(p,vec2(${w.x.toFixed(5)},${w.z.toFixed(5)}))*${w.k.toFixed(5)}-t*${w.speed.toFixed(5)}+${w.phase.toFixed(5)})`).join('+')};}
  `;
  const uniforms={
    uWaterRipples:{value:null},uWaterTexel:{value:new THREE.Vector2(1/resolution,1/resolution)},uWaterTime:shared.time,uOceanSunDirection:{value:new THREE.Vector3(-9,15,8).normalize()}
  };
  const waveGLSL=`
    uniform sampler2D uWaterRipples;
    uniform vec2 uWaterTexel;
    uniform float uWaterTime;
    ${longWaveGLSL}
    float oceanNoiseHash(vec2 p){
      vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);
    }
    vec3 oceanNoiseGradient(vec2 p){
      vec2 i=floor(p),f=fract(p),u=f*f*f*(f*(f*6.-15.)+10.),du=30.*f*f*(f*(f-2.)+1.);
      float a=oceanNoiseHash(i),b=oceanNoiseHash(i+vec2(1.,0.)),c=oceanNoiseHash(i+vec2(0.,1.)),d=oceanNoiseHash(i+1.);
      float k=a-b-c+d;
      return vec3(a+(b-a)*u.x+(c-a)*u.y+k*u.x*u.y,du*vec2(b-a+k*u.y,c-a+k*u.x))*2.-vec3(1.,0.,0.);
    }
    // Capillary/gravity bands share exact height derivatives with the refraction pass.
    // Their interference bends light into moving folds; there is no painted caustic texture.
    float oceanOpticalHeight(vec2 p,float t){
      return .030*sin(dot(p,vec2(.83,.558))*5.2-t*1.7)
        +.021*sin(dot(p,vec2(-.41,.912))*7.7-t*2.05+1.3)
        +.012*sin(dot(p,vec2(.12,.993))*11.1+t*2.65-.8);
    }
    vec2 oceanOpticalSlope(vec2 p,float t){
      return .156*vec2(.83,.558)*cos(dot(p,vec2(.83,.558))*5.2-t*1.7)
        +.1617*vec2(-.41,.912)*cos(dot(p,vec2(-.41,.912))*7.7-t*2.05+1.3)
        +.1332*vec2(.12,.993)*cos(dot(p,vec2(.12,.993))*11.1+t*2.65-.8);
    }
    float oceanWaveHeight(vec2 p){
      float t=uWaterTime;
      vec2 q=mat2(.8,-.6,.6,.8)*p;
      return oceanLongHeight(p,t)+oceanOpticalHeight(p,t)+oceanNoiseGradient(p*2.1+vec2(t*.16,-t*.11)).x*.007

    }
    vec2 oceanMicroSlope(vec2 p){
      float t=uWaterTime;
      float bend=sin(p.x*19.1+p.y*13.7+t*.3)*.65;
      return vec2(.61,.79)*cos(dot(p,vec2(.61,.79))*41.3-t*1.66+bend)*.013
        +vec2(-.95,.31)*cos(dot(p,vec2(-.95,.31))*59.1+t*1.28-bend)*.010;
    }
    vec2 oceanFineSlope(vec2 p){
      float t=uWaterTime;mat2 rotation=mat2(.8,-.6,.6,.8),inverseRotation=mat2(.8,.6,-.6,.8);
      vec2 q=rotation*p;
      vec2 s=oceanLongSlope(p,t)+oceanOpticalSlope(p,t)+oceanNoiseGradient(p*2.1+vec2(t*.16,-t*.11)).yz*.0147
        +inverseRotation*oceanNoiseGradient(q*4.8+vec2(-t*.12,t*.14)+19.).yz*.0096;
      return s+oceanMicroSlope(p);
    }
    vec2 oceanSurfaceSlope(vec2 p){
      vec2 uv=p/12.+.5, e=uWaterTexel;
      vec2 slope=vec2(texture2D(uWaterRipples,uv+vec2(e.x,0.)).r-texture2D(uWaterRipples,uv-vec2(e.x,0.)).r,
        texture2D(uWaterRipples,uv+vec2(0.,e.y)).r-texture2D(uWaterRipples,uv-vec2(0.,e.y)).r)/(e*24.);
      return oceanFineSlope(p)+slope;
    }
  `;
  const targetOptions={type:THREE.HalfFloatType,format:THREE.RGBAFormat,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:false,stencilBuffer:false};
  const fields=[new THREE.WebGLRenderTarget(resolution,resolution,targetOptions),new THREE.WebGLRenderTarget(resolution,resolution,targetOptions)];
  fields.forEach(t=>{t.texture.generateMipmaps=false;t.texture.name='Propagating water height / velocity';});
  uniforms.uWaterRipples.value=fields[0].texture;
  const maskTarget=new THREE.WebGLRenderTarget(mobile?96:128,mobile?96:128,targetOptions);
  maskTarget.texture.name='Moving shoreline height mask';
  const causticsTarget=new THREE.WebGLRenderTarget(mobile?384:512,mobile?384:512,targetOptions);
  causticsTarget.texture.name='Refracted sunlight irradiance';
  const causticUniforms={...uniforms,uOceanCaustics:{value:causticsTarget.texture}};
  const causticGLSL=`
    uniform sampler2D uOceanCaustics;
    uniform vec3 uOceanSunDirection;
    float oceanCausticSample(vec2 p){
      vec2 q=p/12.+.5;
      float border=smoothstep(0.,.012,min(min(q.x,q.y),min(1.-q.x,1.-q.y)));
      return clamp(texture2D(uOceanCaustics,clamp(q,vec2(.002),vec2(.998))).r,0.,2.6)*border;
    }
    float oceanCaustic(vec3 p){
      return oceanCausticSample(p.xz)*(1.-smoothstep(-.13,.025,p.y));
    }
    float oceanCausticOnSurface(vec3 p,vec3 worldNormal){
      // This map already lies on the actual seabed, including its depth and sun displacement.
      // Incidence and projected area suppress long stretched marks on near-vertical cliffs.
      vec3 n=normalize(worldNormal);if(n.y<0.)n=-n;
      vec3 sunInWater=-refract(-uOceanSunDirection,vec3(0.,1.,0.),1./1.333);
      float incidence=max(dot(n,sunInWater),0.);
      float slope=smoothstep(.35,.83,n.y);
      return oceanCaustic(p)*incidence*slope;
    }
  `;
  const plane=new THREE.PlaneGeometry(2,2),screenScene=new THREE.Scene(),screenCamera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const fullscreenVS='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
  const simulation=new THREE.ShaderMaterial({
    uniforms:{uField:{value:fields[0].texture},uMask:{value:maskTarget.texture},uTexel:uniforms.uWaterTexel,uFlow:{value:new THREE.Vector2()},uSource:{value:0},uImpulse:{value:0},uClock:shared.time},
    vertexShader:fullscreenVS,depthTest:false,depthWrite:false,
    fragmentShader:`precision highp float;varying vec2 vUv;uniform sampler2D uField,uMask;uniform vec2 uTexel,uFlow;uniform float uSource,uImpulse,uClock;
      float neighbor(vec2 q,float center){if(q.x<0.||q.y<0.||q.x>1.||q.y>1.||texture2D(uMask,q).g>.5)return center;return texture2D(uField,q).r;}
      void main(){
        if(texture2D(uMask,vUv).g>.5){gl_FragColor=vec4(0.);return;}
        vec2 uv=clamp(vUv-uFlow/720.,uTexel,1.-uTexel), e=uTexel;
        vec2 state=texture2D(uField,uv).rg;float h=state.x,v=state.y;
        float lap=neighbor(uv+vec2(e.x,0.),h)+neighbor(uv-vec2(e.x,0.),h)+neighbor(uv+vec2(0.,e.y),h)+neighbor(uv-vec2(0.,e.y),h)-4.*h;
        v=(v+lap*.42)*.989;h+=v;
        vec2 p=(vUv-.5)*12.;
        // The moving dorsal fin displaces a narrow bow wave and a compensating trough.
        float bow=exp(-dot(p-vec2(0.,-.20),p-vec2(0.,-.20))*95.);
        float trough=exp(-dot(p-vec2(0.,.10),p-vec2(0.,.10))*35.);
        h+=(bow-.368*trough)*uSource*(.0040+.0008*sin(uClock*14.));
        float r=length(p);h+=uImpulse*(exp(-r*r*14.)-.357*exp(-r*r*5.))*.19;
        // Bounded energy keeps repeated splashes stable in a closed miniature volume.
        gl_FragColor=vec4(clamp(h,-.28,.28),clamp(v,-.09,.09),0.,1.);
      }`
  });
  const quad=new THREE.Mesh(plane,simulation);quad.frustumCulled=false;screenScene.add(quad);
  let maskMaterial=new THREE.ShaderMaterial({vertexShader:fullscreenVS,fragmentShader:'void main(){gl_FragColor=vec4(-3.,0.,0.,1.);}',depthTest:false,depthWrite:false});
  const causticGeo=new THREE.PlaneGeometry(12,12,mobile?128:192,mobile?128:192);causticGeo.rotateX(-Math.PI/2);
  const causticMaterial=new THREE.ShaderMaterial({
    uniforms:{...uniforms,uMask:{value:maskTarget.texture}},depthTest:false,depthWrite:false,
    side:THREE.DoubleSide,transparent:true,blending:THREE.AdditiveBlending,
    vertexShader:`${waveGLSL}
      uniform sampler2D uMask;uniform vec3 uOceanSunDirection;
      varying vec3 vSource,vHit;varying float vFlux,vValid;
      float seabed(vec2 p){return texture2D(uMask,clamp(p/12.+.5,vec2(.001),vec2(.999))).r;}
      void main(){
        vec2 p=position.xz;float h=texture2D(uWaterRipples,p/12.+.5).r+oceanWaveHeight(p);
        vec3 source=vec3(p.x,h,p.y);
        vec2 slope=oceanSurfaceSlope(p)-oceanMicroSlope(p);
